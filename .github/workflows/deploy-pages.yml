name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every check, including the browser tests in Chrome and Safari's engine, must pass
      # before anything goes live. A failing check stops the deploy.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
      # Rebuild for GitHub Pages, which serves the app from /kongbu/ (verify built it for /).
      - run: npm run build
        env:
          KONGBU_BASE: /kongbu/
      - run: npm run check:content-split
      # GitHub Pages has no server-side routing: serve the app for any unknown path,
      # so refreshing /kongbu/learn/11 still opens the app.
      - run: cp dist/index.html dist/404.html
      - run: npm run check:secrets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
